; PlatformIO Configuration for WildCam ESP32-CAM Firmware
; Cam_firmware_Cline • v1.0 • September 2026

[env:esp32-cam]
platform = espressif32
board = esp32cam
framework = arduino

; Serial Monitor Configuration
upload_speed = 115200
monitor_speed = 115200

; PSRAM Configuration - Essential for OV2640 camera and JPEG buffering
build_flags = 
    -D CONFIG_ESPFRAM_SPIRAM_USE=true
    -D CONFIG_SPIRAM_USE_PSRAM=true
    -DCORE_DEBUG_LEVEL=3
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_STL_DEBUG

; ESP-IDF Component Configuration (optional, for more control)
; lib_deps = 
;     arduino-libraries/ESPurna@^2.0.0

; Upload Configuration - use USB device detection
extra_scripts = pre:boot.py

[env:esp32-cam-fast]
platform = espressif32
board = esp32cam
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    ${env:esp32-cam.build_flags}
    -DCORE_DEBUG_LEVEL=4

[isr-tools]
version = 1.0
url = https://github.com/pio-tooling/isr-tools/archive/refs/tags/1.0.tar.gz
