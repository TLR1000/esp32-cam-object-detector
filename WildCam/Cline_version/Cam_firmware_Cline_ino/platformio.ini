[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

# Build options
build_flags = 
  -D CORE_DEBUG_LEVEL=3

# Upload settings voor Arduino IDE
upload_speed = 115200
upload_protocol = esptool

# Monitor settings  
monitor_speed = 115200

# Serial monitor defaults
default_port = auto

# Bibliotheken
lib_deps = 
  ESP32Camera@^2.5.0

; Voor Arduino IDE gebruik, handmatige configuratie via Settings.ino
